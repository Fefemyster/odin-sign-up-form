<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <div class="parent-container">
      <div class="logo-container">
        <img
          class="floral-background"
          src="/images/photo-1585202900225-6d3ac20a6962.avif"
          alt="Floral Image"
        />

        <div class="odin-container">
          <img class="odin-logo" src="/images/odin-lined.png" alt="Odin logo" />
          <p>Odin</p>
        </div>

        <div class="photo-credit">
          <p>
            Photo by
            <a class="link-style" href="https://unsplash.com/@haliewestphoto"
              >Halie West</a
            >
            on
            <a
              class="link-style"
              href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA"
              >Unsplash</a
            >
          </p>
        </div>
      </div>

      <div class="elements-container">
        <div class="text-description">
          <div>
            This is not a real online service! You know you need something like
            this in your life to help you realize your deepest dreams. Sign up
            <em>now</em> to get started
          </div>
          <div>You <em>know</em> what you want</div>
        </div>

        <form action="">
          <div class="form-container">
            <h2>Let's do this!</h2>

            <div class="row">
              <div class="column">
                <div class="input-group">
                  <label for="first_name">FIRST NAME</label>
                  <input
                    type="text"
                    id="first_name"
                    name="first_name"
                    placeholder="John"
                  />
                </div>

                <div class="input-group">
                  <label for="email">EMAIL</label>
                  <input
                    type="email"
                    id="email"
                    name="user_email"
                    placeholder="email@example.com"
                  />
                </div>

                <div class="input-group">
                  <label for="user_password">PASSWORD</label>
                  <input type="password" id="user_password" name="password" />
                </div>
              </div>
              <div>
                <div class="column">
                  <div class="input-group">
                    <label for="last_name">LAST NAME</label>
                    <input
                      type="text"
                      id="last_name"
                      name="last_name"
                      placeholder="Doe"
                    />
                  </div>

                  <div class="input-group">
                    <label for="phone_number">PHONE NUMBER</label>
                    <input
                      type="tel"
                      id="user_phone"
                      name="user_phone"
                      pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"
                      placeholder="123-456-7890"
                    />
                  </div>

                  <div class="input-group">
                    <label for="confirm_password">CONFIRM PASSWORD</label>
                    <input
                      type="password"
                      id="confirmed_password"
                      name="confirmed_password"
                    />
                  </div>
                </div>
              </div>
            </div>
          </div>
        </form>

        <div class="submit-section">
          <button type="submit">Create Account</button>
          <div>
            Already have an account? <span class="colored-line">Log in</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
